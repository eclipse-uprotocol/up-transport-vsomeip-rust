[package]
name = "up-transport-vsomeip"
description = "Layer-1 uTransport implementation for vsomeip (SOME/IP)"
documentation.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../README.md"

[features]
default = ["bundled"]
bundled = ["vsomeip-sys/bundled"]

[dependencies]
async-trait = { version = "0.1.92" }
bimap = { version = "0.6.3" }
bytes = { workspace = true }
crossbeam-channel = { version = "0.5.17" }
cxx = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
tempfile = { version = "3.27.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
up-rust = { version = "0.9.0" }
vsomeip-proc-macro = { workspace = true }
vsomeip-sys = { workspace = true }

[dev-dependencies]
hello-world-protos = { path = "../example-utils/hello-world-protos", version = "0.7.0-SNAPSHOT" }
protobuf = { workspace = true }
serial_test = { workspace = true }
test-case = { version = "3.4.1" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = { workspace = true, default-features = false, features = ["log", "std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
