[workspace]
resolver = "2"
members = [
    "example-utils/hello-world-protos",
    "up-transport-vsomeip",
    "vsomeip-proc-macro",
    "vsomeip-sys",
]

[workspace.package]
documentation = "https://github.com/eclipse-uprotocol/up-spec#readme"
edition = "2021"
exclude = [
    "tests/*",
    "tools/*",
    ".devcontainer/*",
    ".vscode/*",
    ".github/*",
    ".gitignore",
]
keywords = ["uProtocol", "SDK", "vsomeip", "SOMEIP"]
license = "Apache-2.0"
repository = "https://github.com/eclipse-uprotocol/up-transport-vsomeip-rust"
rust-version = "1.88"
version = "0.7.0-SNAPSHOT"

[workspace.dependencies]
bytes = { version = "1.12.1" }
cxx = { version = "1.0.205" }
cxx-build = { version = "1.0.205" }
lazy_static = { version = "1.5.1" }
protobuf = { version = "3.7.2", default-features = false }
serial_test = { version = "3.5.0", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
vsomeip-proc-macro = { version = "0.7.0-SNAPSHOT", path = "vsomeip-proc-macro" }
vsomeip-sys = { version = "0.7.0-SNAPSHOT", path = "vsomeip-sys", default-features = false }
