[package]
name = "vsomeip-sys"
description = "Somewhat low level unsafe wrapper around vsomeip"
documentation.workspace = true
edition.workspace = true
exclude.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["bundled", "ssl"]
bundled = ["dep:cmake"]
ssl = ["dep:openssl-sys"]
vendored-ssl = ["bundled", "ssl", "openssl-sys/vendored"]

[dependencies]
autocxx = { version = "0.30.0" }
cxx = { workspace = true }
lazy_static = { workspace = true }
openssl-sys = { version = "0.9.117", optional = true }
tracing = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = { workspace = true, features = ["log", "std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[build-dependencies]
autocxx-build = { version = "0.30.0" }
cmake = { version = "0.1.58" , optional = true }
cxx-build = { workspace = true }
miette = { version = "5.10.0", features = ["fancy"] }
