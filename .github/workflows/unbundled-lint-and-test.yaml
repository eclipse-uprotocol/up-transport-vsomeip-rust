name: Lint and Test - Unbundled

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - ".github/**"
      - "**/include/**"
      - "**/src/**"
      - "**/Cargo.*"
      - "build/**"
  workflow_call:
    inputs:
      RUST_TOOLCHAIN:
        type: string
        description: 'The Rust toolchain to use for the workflow'
        required: false
        default: 'stable'
  workflow_dispatch:
    inputs:
      RUST_TOOLCHAIN:
        description: 'The Rust toolchain to use for the workflow'
        required: false
        default: 'stable'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read # needed for checking out the code

env:
  RUST_TOOLCHAIN: ${{ inputs.RUST_TOOLCHAIN || 'stable' }}

jobs:

  obtain_and_build_vsomeip:
    runs-on: ubuntu-22.04
    env:
      VSOMEIP_RELEASE_URL: https://github.com/COVESA/vsomeip/archive/refs/tags/
      VSOMEIP_RELEASE_TAG: 3.4.10.tar.gz
      VSOMEIP_SOURCE_PATH: vsomeip-src
    outputs:
      cache_key: ${{ steps.cache-vsomeip.outputs.cache-primary-key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup build environment
        id: setup-env
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/build-envsetup.sh"

      - name: Download and extract vsomeip tarball
        id: download-vsomeip
        env:
          VSOMEIP_SOURCE_PATH: ${{ github.workspace }}/${{ env.VSOMEIP_SOURCE_PATH }}
          VSOMEIP_SOURCE_TARBALL: ${{ env.VSOMEIP_RELEASE_URL }}${{ env.VSOMEIP_RELEASE_TAG }}
        run: |
          wget -O vsomeip-source.tar.gz $VSOMEIP_SOURCE_TARBALL
          mkdir -p $VSOMEIP_SOURCE_PATH
          tar --strip-components=1 -xzf vsomeip-source.tar.gz -C $VSOMEIP_SOURCE_PATH
          echo "Current working directory: $(pwd)"
          echo "Contents of repository root:"
          ls -l
          echo "Contents of decompressed folder ($VSOMEIP_SOURCE_PATH):"
          ls -l $VSOMEIP_SOURCE_PATH
          {
            echo "VSOMEIP_SOURCE_PATH=$VSOMEIP_SOURCE_PATH"
            echo "VSOMEIP_SOURCE_PATH_WITH_WILDCARD=$VSOMEIP_SOURCE_PATH/*"
          } >> $GITHUB_OUTPUT

      - name: Restore vsomeip binaries from cache
        id: cache-vsomeip
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          key: ${{ runner.os }}-vsomeip-${{ hashFiles(steps.download-vsomeip.outputs.VSOMEIP_SOURCE_PATH_WITH_WILDCARD) }}
          restore-keys: |
            ${{ runner.os }}-vsomeip-

      - name: Install dependencies
        if: steps.cache-vsomeip.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/install-build-deps.sh"

      - name: Build vsomeip
        if: steps.cache-vsomeip.outputs.cache-hit != 'true'
        env:
          ARCH_SPECIFIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.ARCH_SPECIFIC_CPP_STDLIB_PATH }}
          GENERIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.GENERIC_CPP_STDLIB_PATH }}
          VSOMEIP_INSTALL_PATH: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          VSOMEIP_SOURCE_PATH: ${{ steps.download-vsomeip.outputs.VSOMEIP_SOURCE_PATH }}
        run: |
          cd $VSOMEIP_SOURCE_PATH
          cmake -Bbuild \
            -DCMAKE_INSTALL_PREFIX=$VSOMEIP_INSTALL_PATH \
            -DENABLE_SIGNAL_HANDLING=1 .
          cmake --build build --target install

      - name: Save vsomeip binaries to cache
        if: steps.cache-vsomeip.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          key: ${{ steps.cache-vsomeip.outputs.cache-primary-key }}

  lint:
    name: Lint
    needs: 
      - obtain_and_build_vsomeip
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Setup environment variables
        id: setup-env
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/build-envsetup.sh"

      - name: Restore vsomeip binaries from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: true
          path: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          key: ${{ needs.obtain_and_build_vsomeip.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-vsomeip-

      - name: Check for code errors
        env:
          VSOMEIP_INSTALL_PATH: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          ARCH_SPECIFIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.ARCH_SPECIFIC_CPP_STDLIB_PATH }}
          GENERIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.GENERIC_CPP_STDLIB_PATH }}
        working-directory: ${{github.workspace}}
        run: cargo check --no-default-features

      - name: Check code formatting
        env:
          VSOMEIP_INSTALL_PATH: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          ARCH_SPECIFIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.ARCH_SPECIFIC_CPP_STDLIB_PATH }}
          GENERIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.GENERIC_CPP_STDLIB_PATH }}
        working-directory: ${{github.workspace}}
        run: cargo fmt -- --check

      - name: Run Clippy
        env:
          VSOMEIP_INSTALL_PATH: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          ARCH_SPECIFIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.ARCH_SPECIFIC_CPP_STDLIB_PATH }}
          GENERIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.GENERIC_CPP_STDLIB_PATH }}
        working-directory: ${{github.workspace}}
        run: cargo clippy --no-default-features --all-targets -- -W warnings -D warnings

  test:
    name: Test
    needs: 
      - obtain_and_build_vsomeip
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Show toolchain information
        working-directory: ${{github.workspace}}
        run: |
          rustup toolchain list
          cargo --version

      - name: Setup environment variables
        id: setup-env
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/install-build-deps.sh"
          source "$GITHUB_WORKSPACE/.github/scripts/build-envsetup.sh"

      - name: Restore vsomeip binaries from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: true
          path: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          key: ${{ needs.obtain_and_build_vsomeip.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-vsomeip-

      - name: Run tests
        env:
          VSOMEIP_INSTALL_PATH: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          ARCH_SPECIFIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.ARCH_SPECIFIC_CPP_STDLIB_PATH }}
          GENERIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.GENERIC_CPP_STDLIB_PATH }}
        run: |
          LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$VSOMEIP_INSTALL_PATH/lib \
            cargo test --no-default-features --all-targets

  build-docs:
    name: Build documentation
    needs: 
      - obtain_and_build_vsomeip
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Setup environment variables
        id: setup-env
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/build-envsetup.sh"

      - name: Restore vsomeip binaries from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: true
          path: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          key: ${{ needs.obtain_and_build_vsomeip.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-vsomeip-

      - name: Create Documentation for vsomeip-sys
        env:
          VSOMEIP_INSTALL_PATH: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          ARCH_SPECIFIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.ARCH_SPECIFIC_CPP_STDLIB_PATH }}
          GENERIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.GENERIC_CPP_STDLIB_PATH }}
        working-directory: ${{github.workspace}}
        run: RUSTDOCFLAGS=-Dwarnings cargo doc -p vsomeip-sys --no-deps --no-default-features

      - name: Create Documentation for up-transport-vsomeip
        env:
          VSOMEIP_INSTALL_PATH: ${{ steps.setup-env.outputs.VSOMEIP_INSTALL_PATH }}
          ARCH_SPECIFIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.ARCH_SPECIFIC_CPP_STDLIB_PATH }}
          GENERIC_CPP_STDLIB_PATH: ${{ steps.setup-env.outputs.GENERIC_CPP_STDLIB_PATH }}
        working-directory: ${{github.workspace}}
        run: RUSTDOCFLAGS=-Dwarnings cargo doc -p up-transport-vsomeip --no-deps --no-default-features
