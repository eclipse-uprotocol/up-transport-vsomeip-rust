[package]
name = "hello-world-protos"
description = "Useful protos to be used when doing tests"
documentation.workspace = true
edition.workspace = true
exclude.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = { workspace = true }
protobuf = { workspace = true, features = ["with-bytes"] }

[build-dependencies]
protobuf-codegen = { version = "3.7.2" }
protoc-bin-vendored = { version = "3.3.0" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "default-tls", "http2"] }
# https://rustsec.org/advisories/RUSTSEC-2026-0349 et al.
rustls = { version = "0.23.46" }
# https://rustsec.org/advisories/RUSTSEC-2026-0382
rustls-webpki = { version = "0.103.17" }
